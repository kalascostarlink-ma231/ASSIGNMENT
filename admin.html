<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Excel Booking Center</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="Excel Booking Center home">
        <span class="logo-mark" aria-hidden="true">EBC</span>
        <span class="logo-text">Excel Booking Center &mdash; Admin</span>
      </a>
    </div>
  </header>

  <main>
    <section class="admin-section">
      <div class="container">

        <div id="loggedOutView">
          <h1 class="section-title">Admin Access</h1>
          <p class="section-subtitle">Log in with the admin account created in Supabase to view customer bookings.</p>

          <form class="admin-login-form" id="loginForm" novalidate>
            <div class="form-group">
              <label for="loginEmail">Email</label>
              <input type="email" id="loginEmail" name="loginEmail" autocomplete="username" />
            </div>
            <div class="form-group">
              <label for="loginPassword">Password</label>
              <input type="password" id="loginPassword" name="loginPassword" autocomplete="current-password" />
            </div>
            <p class="admin-status" id="loginStatus"></p>
            <button type="submit" class="btn btn-primary btn-lg">Log In</button>
          </form>
        </div>

        <div id="loggedInView" class="hidden">
          <div class="admin-toolbar">
            <h1 class="section-title" style="margin:0;">Bookings</h1>
            <div class="admin-toolbar-actions">
              <button class="btn btn-secondary" id="refreshBtn">Refresh</button>
              <button class="btn btn-secondary" id="logoutBtn">Log Out</button>
            </div>
          </div>

          <p id="adminStatus" class="admin-status"></p>

          <div class="admin-table-wrap">
            <table class="admin-table" id="bookingsTable">
              <thead>
                <tr>
                  <th>Reference</th>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Email</th>
                  <th>Date</th>
                  <th>Service(s) &amp; Times</th>
                  <th>Total</th>
                  <th>Notes</th>
                  <th>Submitted</th>
                </tr>
              </thead>
              <tbody id="bookingsTableBody"></tbody>
            </table>
          </div>

          <p class="empty-state hidden" id="bookingsAdminEmpty">No bookings have been submitted yet.</p>
        </div>

      </div>
    </section>
  </main>

  <script>
    'use strict';

    // Same project config as js/script.js — replace with your real Supabase values.
    const SUPABASE_URL = 'https://btbykqususlhajdahrpg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_pgAOYkhhIOALErwSJg1Hzw_p_-s2gHl';

    const SESSION_KEY = 'ebc_admin_session';

    // Formats an ISO timestamp as a short readable date/time for the admin table.
    function formatSubmittedAt(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('en-US', {
        year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
      });
    }

    // Persists the logged-in admin's access token for this browser tab's session only.
    function saveSession(session) {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
    }
    function loadSession() {
      try {
        return JSON.parse(sessionStorage.getItem(SESSION_KEY));
      } catch {
        return null;
      }
    }
    function clearSession() {
      sessionStorage.removeItem(SESSION_KEY);
    }

    // Logs an admin in against Supabase Auth using plain fetch (no SDK required).
    async function login(email, password) {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error_description || data.msg || 'Login failed.');
      return { accessToken: data.access_token, email };
    }

    // Renders the bookings array into the admin table, or shows the empty state.
    function renderBookingsTable(bookings) {
      const tbody = document.getElementById('bookingsTableBody');
      const emptyState = document.getElementById('bookingsAdminEmpty');
      const table = document.getElementById('bookingsTable');
      tbody.innerHTML = '';

      if (!bookings.length) {
        table.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      table.classList.remove('hidden');
      emptyState.classList.add('hidden');

      bookings.forEach((b) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${b.reference || '—'}</td>
          <td>${b.full_name || '—'}</td>
          <td>${b.phone || '—'}</td>
          <td>${b.email || '—'}</td>
          <td>${b.booking_date || '—'}</td>
          <td>${(b.services || '—').split(';').join('<br />')}</td>
          <td>$${b.total_price ?? '—'}</td>
          <td>${b.notes || '—'}</td>
          <td>${formatSubmittedAt(b.created_at)}</td>
        `;
        tbody.appendChild(row);
      });
    }

    // Fetches bookings from Supabase's REST API using the logged-in admin's access token.
    // Row Level Security on the `bookings` table only allows authenticated reads (see README),
    // so this request is rejected unless accessToken belongs to a real logged-in admin.
    async function loadBookings() {
      const status = document.getElementById('adminStatus');
      const session = loadSession();
      if (!session) return;

      status.textContent = 'Loading bookings…';
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/bookings?select=*&order=created_at.desc`, {
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${session.accessToken}` },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed to load bookings.');
        renderBookingsTable(data);
        status.textContent = `${data.length} booking(s) loaded.`;
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      }
    }

    // Switches the visible view based on whether an admin is currently logged in.
    function showLoggedIn(isLoggedIn) {
      document.getElementById('loggedOutView').classList.toggle('hidden', isLoggedIn);
      document.getElementById('loggedInView').classList.toggle('hidden', !isLoggedIn);
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (SUPABASE_URL.includes('YOUR_SUPABASE') || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE')) {
        document.getElementById('loginStatus').textContent =
          'Supabase is not configured yet — add SUPABASE_URL and SUPABASE_ANON_KEY in admin.html and js/script.js.';
      }

      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const status = document.getElementById('loginStatus');
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        status.textContent = 'Logging in…';
        try {
          const session = await login(email, password);
          saveSession(session);
          status.textContent = '';
          showLoggedIn(true);
          loadBookings();
        } catch (err) {
          status.textContent = err.message;
        }
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        clearSession();
        showLoggedIn(false);
      });

      document.getElementById('refreshBtn').addEventListener('click', loadBookings);

      const existingSession = loadSession();
      showLoggedIn(!!existingSession);
      if (existingSession) loadBookings();
    });
  </script>
</body>
</html>
