<!-- ===================== ADMIN ===================== -->
<section class="section admin-page">
  <div class="container">

    <!-- Logged out: login form -->
    <div id="admin-login-view">
      <div class="section-head">
        <div>
          <h2>Admin Access</h2>
          <p>Log in with your Supabase admin account to view customer orders.</p>
        </div>
      </div>
      <form class="lookup-form" id="login-form" style="max-width:420px;">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <p class="lookup-status" id="login-status"></p>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>
    </div>

    <!-- Logged in: orders dashboard -->
    <div id="admin-orders-view" class="hidden">

      <div class="admin-header-row">
        <div>
          <h1>Orders</h1>
          <p class="admin-note" id="admin-note"></p>
        </div>
        <div class="admin-toolbar-actions">
          <button type="button" class="btn btn-outline" id="refresh-btn">Refresh</button>
          <button type="button" class="btn btn-outline" id="logout-btn">Log Out</button>
        </div>
      </div>

      <div class="admin-summary-cards">
        <div class="summary-card">
          <strong id="stat-total">0</strong>
          <span>Total Orders</span>
        </div>
        <div class="summary-card">
          <strong id="stat-new">0</strong>
          <span>New / Unfulfilled</span>
        </div>
        <div class="summary-card">
          <strong id="stat-revenue">$0.00</strong>
          <span>Revenue (non-cancelled)</span>
        </div>
      </div>

      <div class="filter-chips" id="filter-chips">
        <button type="button" class="filter-chip active" data-status="all">All</button>
        <button type="button" class="filter-chip" data-status="new">New</button>
        <button type="button" class="filter-chip" data-status="fulfilled">Fulfilled</button>
        <button type="button" class="filter-chip" data-status="cancelled">Cancelled</button>
      </div>

      <div class="orders-table-wrap" id="orders-table-wrap">
        <table class="orders-table">
          <thead>
            <tr>
              <th>Status</th>
              <th>Order Ref</th>
              <th>Customer</th>
              <th>Items</th>
              <th>Total</th>
              <th>Placed</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="orders-table-body"></tbody>
        </table>
      </div>

      <p class="admin-empty" id="orders-empty" style="display:none;">No orders yet.</p>
    </div>

  </div>
</section>

<script>
'use strict';

// Same project config as js/script.js.
const SUPABASE_URL = 'https://btbykqususlhajdahrpg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_pgAOYkhhIOALErwSJg1Hzw_p_-s2gHl';

const SESSION_KEY = 'excel_bakery_admin_session';
let loadedOrders = [];
let activeFilter = 'all';

// ---------- Session ----------

function saveSession(session) {
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
}
function loadSession() {
  try {
    return JSON.parse(sessionStorage.getItem(SESSION_KEY));
  } catch {
    return null;
  }
}
function clearSession() {
  sessionStorage.removeItem(SESSION_KEY);
}

// Logs an admin in against Supabase Auth using plain fetch (no SDK required).
async function login(email, password) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || 'Login failed.');
  return { accessToken: data.access_token, email };
}

function showLoggedIn(isLoggedIn) {
  document.getElementById('admin-login-view').classList.toggle('hidden', isLoggedIn);
  document.getElementById('admin-orders-view').classList.toggle('hidden', !isLoggedIn);
}

// ---------- Formatting ----------

function formatPlacedAt(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-US', {
    year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
  });
}

// ---------- Rendering ----------

function renderSummary(orders) {
  const nonCancelled = orders.filter((o) => (o.status || 'new') !== 'cancelled');
  const revenue = nonCancelled.reduce((sum, o) => sum + Number(o.total || 0), 0);

  document.getElementById('stat-total').textContent = orders.length;
  document.getElementById('stat-new').textContent = orders.filter((o) => (o.status || 'new') === 'new').length;
  document.getElementById('stat-revenue').textContent = `$${revenue.toFixed(2)}`;
}

function renderOrdersTable() {
  renderSummary(loadedOrders);

  const filtered = activeFilter === 'all'
    ? loadedOrders
    : loadedOrders.filter((o) => (o.status || 'new') === activeFilter);

  const tbody = document.getElementById('orders-table-body');
  const wrap = document.getElementById('orders-table-wrap');
  const empty = document.getElementById('orders-empty');

  if (!filtered.length) {
    wrap.style.display = 'none';
    empty.style.display = 'block';
    empty.textContent = loadedOrders.length ? 'No orders match this filter.' : 'No orders have been placed yet.';
    return;
  }

  wrap.style.display = 'block';
  empty.style.display = 'none';

  tbody.innerHTML = filtered.map((order) => {
    const status = order.status || 'new';
    const itemsList = (order.items || [])
      .map((item) => `<li>${item.qty} × ${item.name}</li>`)
      .join('');

    return `
      <tr data-ref="${order.ref}">
        <td><span class="status-pill ${status}">${status}</span></td>
        <td>${order.ref}</td>
        <td>
          <strong>${order.name || '—'}</strong><br>
          ${order.phone || '—'}<br>
          <span style="color:var(--ink-muted);">${order.address || '—'}</span>
        </td>
        <td><ul class="order-items-list">${itemsList}</ul></td>
        <td>$${Number(order.total || 0).toFixed(2)}</td>
        <td>${formatPlacedAt(order.placed_at)}</td>
        <td>
          <div class="row-actions">
            ${status !== 'fulfilled' ? `<button type="button" class="btn-fulfill" data-action="fulfill">Mark Fulfilled</button>` : ''}
            ${status !== 'cancelled' ? `<button type="button" class="btn-cancel" data-action="cancel">Cancel</button>` : ''}
            <button type="button" class="btn-delete" data-action="delete">Delete</button>
          </div>
        </td>
      </tr>`;
  }).join('');
}

// ---------- Data ----------

// Row Level Security on the `orders` table only allows authenticated reads (see README),
// so this request is rejected unless accessToken belongs to a real logged-in admin.
async function loadOrders() {
  const note = document.getElementById('admin-note');
  const session = loadSession();
  if (!session) return;

  note.textContent = 'Loading orders…';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=placed_at.desc`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${session.accessToken}` },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Failed to load orders.');
    loadedOrders = data;
    renderOrdersTable();
    note.textContent = `${data.length} order(s) loaded — logged in as ${session.email}.`;
  } catch (err) {
    note.textContent = `Error: ${err.message}`;
  }
}

async function updateOrderStatus(ref, status) {
  const note = document.getElementById('admin-note');
  const session = loadSession();
  if (!session) return;

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?ref=eq.${encodeURIComponent(ref)}`, {
      method: 'PATCH',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${session.accessToken}`,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal',
      },
      body: JSON.stringify({ status }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.message || 'Failed to update order.');
    }
    await loadOrders();
  } catch (err) {
    note.textContent = `Error: ${err.message}`;
  }
}

async function deleteOrder(ref) {
  const note = document.getElementById('admin-note');
  const session = loadSession();
  if (!session) return;

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?ref=eq.${encodeURIComponent(ref)}`, {
      method: 'DELETE',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${session.accessToken}` },
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.message || 'Failed to delete order.');
    }
    await loadOrders();
  } catch (err) {
    note.textContent = `Error: ${err.message}`;
  }
}

// ---------- Wiring ----------

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('login-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const status = document.getElementById('login-status');
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    status.textContent = 'Logging in…';
    try {
      const session = await login(email, password);
      saveSession(session);
      status.textContent = '';
      showLoggedIn(true);
      loadOrders();
    } catch (err) {
      status.textContent = err.message;
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    clearSession();
    showLoggedIn(false);
  });

  document.getElementById('refresh-btn').addEventListener('click', loadOrders);

  document.getElementById('filter-chips').addEventListener('click', (event) => {
    const btn = event.target.closest('.filter-chip');
    if (!btn) return;
    document.querySelectorAll('.filter-chip').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.status;
    renderOrdersTable();
  });

  document.getElementById('orders-table-body').addEventListener('click', (event) => {
    const btn = event.target.closest('button[data-action]');
    if (!btn) return;
    const ref = btn.closest('tr').dataset.ref;
    const action = btn.dataset.action;

    if (action === 'fulfill') updateOrderStatus(ref, 'fulfilled');
    if (action === 'cancel') updateOrderStatus(ref, 'cancelled');
    if (action === 'delete') {
      if (confirm(`Delete order ${ref}? This cannot be undone.`)) deleteOrder(ref);
    }
  });

  const existingSession = loadSession();
  showLoggedIn(!!existingSession);
  if (existingSession) loadOrders();
});
</script>
